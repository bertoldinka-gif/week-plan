<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00a896">
    <title>Семейный ежедневник</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --teal: #00a896;
            --teal-dark: #008b7c;
            --teal-light: #e0f5f3;
            --red: #e63946;
            --bg: #eef2f5;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        .header {
            background-color: var(--teal);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            flex-wrap: wrap;
            gap: 8px;
        }

        .week-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .week-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            min-width: 135px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .days-container {
            max-width: 600px;
            margin: 12px auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.1s;
        }

        .day-card.today {
            background: var(--teal-light);
            border: 1.5px solid var(--teal);
        }

        .day-main {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            cursor: pointer;
        }

        .date-box {
            width: 72px;
            text-align: center;
            border-right: 1px solid var(--border);
            padding-right: 10px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .day-card.today .date-box {
            border-right-color: rgba(0, 168, 150, 0.25);
        }

        .dow {
            font-size: 13px;
            font-weight: 600;
            text-transform: lowercase;
            color: var(--text-muted);
        }

        .day-num {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.1;
            margin: 2px 0;
            color: var(--text-main);
        }

        .month-name {
            font-size: 12px;
            color: var(--text-muted);
        }

        .day-card.today .dow,
        .day-card.today .day-num,
        .day-card.today .month-name {
            color: var(--teal-dark);
        }

        .day-card.weekend:not(.today) .dow,
        .day-card.weekend:not(.today) .day-num {
            color: var(--red);
        }

        .status-box {
            flex-grow: 1;
            min-width: 0;
        }

        .status-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-text {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            min-width: 28px;
        }

        .progress-track {
            flex-grow: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .add-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .add-btn:active {
            background: var(--teal);
            color: white;
            border-color: var(--teal);
        }

        .tasks-list {
            display: none;
            padding: 8px 14px 14px 14px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.6);
        }

        .day-card.expanded .tasks-list {
            display: block;
        }

        .empty-tasks {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 9px 6px;
            border-bottom: 1px solid #f1f5f9;
            gap: 10px;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-check {
            width: 22px;
            height: 22px;
            accent-color: var(--teal);
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-info {
            flex-grow: 1;
            min-width: 0;
            cursor: pointer;
        }

        .task-text {
            font-size: 15px;
            word-break: break-word;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            font-size: 12px;
            color: var(--teal-dark);
        }

        .badge-repeat {
            background: var(--teal-light);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .edit-task-btn,
        .del-task-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 17px;
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 6px;
            line-height: 1;
        }

        .edit-task-btn:hover {
            color: var(--teal);
        }

        .del-task-btn:hover {
            color: var(--red);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 18px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--teal);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 15px;
            padding: 4px 0;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--teal);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-primary {
            background: var(--teal);
            color: white;
        }

        .help-text {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
            margin-top: 6px;
        }

        .code-area {
            width: 100%;
            min-height: 120px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 12px;
            font-family: monospace;
            outline: none;
            resize: vertical;
            word-break: break-all;
        }

        .code-area:focus {
            border-color: var(--teal);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="week-nav">
            <button class="nav-btn" onclick="changeWeek(-1)" aria-label="Предыдущая неделя">◀</button>
            <div class="week-title" id="weekTitle">Текущая неделя</div>
            <button class="nav-btn" onclick="changeWeek(1)" aria-label="Следующая неделя">▶</button>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="goToday()" title="К текущей неделе">📅</button>
            <button class="icon-btn" onclick="openExportModal()" title="Поделиться делами">📤</button>
            <button class="icon-btn" onclick="openImportModal()" title="Импорт дел">📥</button>
        </div>
    </header>

    <main id="daysContainer" class="days-container"></main>

    <!-- Модальное окно добавления/редактирования дела -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h3 id="modalDateTitle">Новое дело</h3>
            <div class="form-group">
                <label for="taskTitleInput">Название дела</label>
                <input type="text" id="taskTitleInput" class="form-input" placeholder="Например: Позвонить бабушке">
            </div>
            <div class="form-group">
                <label for="taskTimeInput">Время (необязательно)</label>
                <input type="time" id="taskTimeInput" class="form-input">
            </div>
            <label class="checkbox-row">
                <input type="checkbox" id="taskRepeatInput">
                Повторять каждую неделю в этот день
            </label>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('addModal')">Отмена</button>
                <button class="btn btn-primary" id="taskSubmitBtn" onclick="submitTaskForm()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно экспорта -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h3>Поделиться делами</h3>
            <p class="help-text" style="margin-bottom: 10px;">
                Скопируйте код и отправьте его в семейный чат. На другом устройстве нажмите «Импорт» и вставьте этот код.
            </p>
            <textarea id="exportCodeArea" class="code-area" readonly></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('exportModal')">Закрыть</button>
                <button class="btn btn-primary" onclick="copyExportCode(event)">Копировать</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно импорта -->
    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <h3>Импорт дел</h3>
            <p class="help-text" style="margin-bottom: 10px;">
                Вставьте код, который вам прислали, и нажмите «Импортировать».
            </p>
            <textarea id="importCodeArea" class="code-area" placeholder="Вставьте код сюда..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('importModal')">Отмена</button>
                <button class="btn btn-primary" onclick="applyImportCode()">Импортировать</button>
            </div>
        </div>
    </div>

    <script>
        let weekOffset = 0;
        let expandedDates = new Set();
        let selectedDateStr = '';
        let editingTaskId = null;
        let appData = {
            updatedAt: 0,
            tasks: [],
            completed: {}
        };

        const MONTHS_GEN = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
        const DAYS_SHORT = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];

        function init() {
            const local = localStorage.getItem('family_planner_v1');
            if (local) {
                try { appData = JSON.parse(local); } catch (e) {}
            }
            const todayStr = formatDateISO(new Date());
            expandedDates.add(todayStr);
            renderWeek();
        }

        function getMonday(offsetWeeks = 0) {
            const now = new Date();
            const day = now.getDay();
            const diff = (day === 0 ? -6 : 1) - day + (offsetWeeks * 7);
            return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
        }

        function formatDateISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function changeWeek(delta) {
            weekOffset += delta;
            renderWeek();
        }

        function goToday() {
            weekOffset = 0;
            expandedDates.add(formatDateISO(new Date()));
            renderWeek();
        }

        function renderWeek() {
            const container = document.getElementById('daysContainer');
            if (!container) return;
            container.innerHTML = '';

            const monday = getMonday(weekOffset);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            if (weekOffset === 0) {
                document.getElementById('weekTitle').textContent = 'Текущая неделя';
            } else {
                document.getElementById('weekTitle').textContent =
                    `${monday.getDate()} ${MONTHS_GEN[monday.getMonth()].slice(0, 3)} — ${sunday.getDate()} ${MONTHS_GEN[sunday.getMonth()].slice(0, 3)}`;
            }

            const todayISO = formatDateISO(new Date());

            for (let i = 0; i < 7; i++) {
                const current = new Date(monday);
                current.setDate(monday.getDate() + i);
                const dateISO = formatDateISO(current);
                const isToday = (dateISO === todayISO);
                const isWeekend = (i === 5 || i === 6);

                const dayTasks = appData.tasks.filter(t => {
                    if (t.repeat) {
                        return t.dow === i && dateISO >= t.dateStr;
                    }
                    return t.dateStr === dateISO;
                });

                dayTasks.sort((a, b) => {
                    if (a.time && b.time) return a.time.localeCompare(b.time);
                    if (a.time) return -1;
                    if (b.time) return 1;
                    return 0;
                });

                const total = dayTasks.length;
                let doneCount = 0;
                dayTasks.forEach(t => {
                    if (appData.completed[`${t.id}_${dateISO}`]) doneCount++;
                });

                let statusText = 'Нет дел';
                let barColor = '#cbd5e1';
                let percent = 0;
                if (total > 0) {
                    percent = Math.round((doneCount / total) * 100);
                    if (doneCount === total) {
                        statusText = 'Дела решены';
                        barColor = '#00a896';
                    } else if (isToday) {
                        const left = total - doneCount;
                        statusText = `${left} ${pluralizeTasks(left)}`;
                        barColor = '#e63946';
                    } else {
                        statusText = `${total} ${pluralizeAll(total)}`;
                        barColor = doneCount > 0 ? '#f4a261' : '#e63946';
                    }
                }

                const card = document.createElement('div');
                card.className = `day-card ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''} ${expandedDates.has(dateISO) ? 'expanded' : ''}`;

                let tasksHtml = '';
                if (dayTasks.length === 0) {
                    tasksHtml = '<div class="empty-tasks">Задач на этот день пока нет</div>';
                } else {
                    tasksHtml = dayTasks.map(t => {
                        const isDone = !!appData.completed[`${t.id}_${dateISO}`];
                        return `
                            <div class="task-item ${isDone ? 'done' : ''}">
                                <input type="checkbox" class="task-check" ${isDone ? 'checked' : ''} onchange="toggleTask('${t.id}', '${dateISO}')">
                                <div class="task-info" onclick="toggleTask('${t.id}', '${dateISO}')">
                                    <div class="task-text">${escapeHtml(t.title)}</div>
                                    ${(t.time || t.repeat) ? `
                                        <div class="task-meta">
                                            ${t.time ? `<span>🕒 ${t.time}</span>` : ''}
                                            ${t.repeat ? '<span class="badge-repeat">↻ каждую неделю</span>' : ''}
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="task-actions">
                                    <button class="edit-task-btn" onclick="openEditModal(event, '${t.id}')" title="Редактировать дело">✎</button>
                                    <button class="del-task-btn" onclick="deleteTask('${t.id}')" title="Удалить дело">✕</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                card.innerHTML = `
                    <div class="day-main" onclick="toggleDayExpand('${dateISO}')">
                        <div class="date-box">
                            <div class="dow">${DAYS_SHORT[i]}</div>
                            <div class="day-num">${current.getDate()}</div>
                            <div class="month-name">${MONTHS_GEN[current.getMonth()]}</div>
                        </div>
                        <div class="status-box">
                            <div class="status-title">${statusText}</div>
                            <div class="progress-row">
                                <span class="counter-text">${doneCount}/${total}</span>
                                <div class="progress-track">
                                    <div class="progress-fill" style="width: ${percent}%; background-color: ${barColor};"></div>
                                </div>
                            </div>
                        </div>
                        <button class="add-btn" onclick="openAddModal(event, '${dateISO}', '${current.getDate()} ${MONTHS_GEN[current.getMonth()]}')">+</button>
                    </div>
                    <div class="tasks-list">
                        ${tasksHtml}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function pluralizeTasks(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'нерешённое дело';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'нерешённых дела';
            return 'нерешённых дел';
        }

        function pluralizeAll(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'дело';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'дела';
            return 'дел';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[m]));
        }

        function toggleDayExpand(dateISO) {
            if (expandedDates.has(dateISO)) {
                expandedDates.delete(dateISO);
            } else {
                expandedDates.add(dateISO);
            }
            renderWeek();
        }

        function openAddModal(event, dateISO, readableDate) {
            if (event) event.stopPropagation();
            editingTaskId = null;
            selectedDateStr = dateISO;
            document.getElementById('modalDateTitle').textContent = `Дело на ${readableDate}`;
            document.getElementById('taskTitleInput').value = '';
            document.getElementById('taskTimeInput').value = '';
            document.getElementById('taskRepeatInput').checked = false;
            document.getElementById('taskSubmitBtn').textContent = 'Добавить';
            document.getElementById('addModal').classList.add('open');
            setTimeout(() => document.getElementById('taskTitleInput').focus(), 100);
        }

        function openEditModal(event, taskId) {
            if (event) event.stopPropagation();
            const task = appData.tasks.find(t => t.id === taskId);
            if (!task) return;

            editingTaskId = taskId;
            selectedDateStr = task.dateStr;

            document.getElementById('modalDateTitle').textContent = 'Редактировать дело';
            document.getElementById('taskTitleInput').value = task.title || '';
            document.getElementById('taskTimeInput').value = task.time || '';
            document.getElementById('taskRepeatInput').checked = !!task.repeat;
            document.getElementById('taskSubmitBtn').textContent = 'Сохранить';
            document.getElementById('addModal').classList.add('open');
            setTimeout(() => document.getElementById('taskTitleInput').focus(), 100);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
            if (id === 'addModal') {
                editingTaskId = null;
            }
        }

        function submitTaskForm() {
            if (editingTaskId) {
                saveEditedTask();
            } else {
                saveNewTask();
            }
        }

        function saveNewTask() {
            const title = document.getElementById('taskTitleInput').value.trim();
            if (!title) return;

            const time = document.getElementById('taskTimeInput').value;
            const repeat = document.getElementById('taskRepeatInput').checked;

            const [y, m, d] = selectedDateStr.split('-').map(Number);
            const dObj = new Date(y, m - 1, d);
            const jsDay = dObj.getDay();
            const dow = jsDay === 0 ? 6 : jsDay - 1;

            appData.tasks.push({
                id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                title,
                time,
                repeat,
                dow,
                dateStr: selectedDateStr
            });

            expandedDates.add(selectedDateStr);
            closeModal('addModal');
            saveData();
        }

        function saveEditedTask() {
            const task = appData.tasks.find(t => t.id === editingTaskId);
            if (!task) {
                closeModal('addModal');
                return;
            }

            const title = document.getElementById('taskTitleInput').value.trim();
            if (!title) return;

            const time = document.getElementById('taskTimeInput').value;
            const repeat = document.getElementById('taskRepeatInput').checked;

            const [y, m, d] = task.dateStr.split('-').map(Number);
            const dObj = new Date(y, m - 1, d);
            const jsDay = dObj.getDay();
            const dow = jsDay === 0 ? 6 : jsDay - 1;

            task.title = title;
            task.time = time;
            task.repeat = repeat;
            task.dow = dow;

            closeModal('addModal');
            saveData();
        }

        function toggleTask(taskId, dateISO) {
            const key = `${taskId}_${dateISO}`;
            if (appData.completed[key]) {
                delete appData.completed[key];
            } else {
                appData.completed[key] = true;
            }
            saveData();
        }

        function deleteTask(taskId) {
            if (!confirm('Удалить это дело? (Если оно повторяющееся, оно удалится со всех недель)')) return;
            appData.tasks = appData.tasks.filter(t => t.id !== taskId);
            saveData();
        }

        function saveData() {
            appData.updatedAt = Date.now();
            localStorage.setItem('family_planner_v1', JSON.stringify(appData));
            renderWeek();
        }

        // --- Экспорт / импорт: компактный формат + LZW + Base64URL ---

        // LZW-сжатие строки в массив байтов (Unicode-safe через UTF-8)
        function lzwEncode(str) {
            const dict = new Map();
            let dictSize = 256;
            for (let i = 0; i < 256; i++) dict.set(String.fromCharCode(i), i);
            let w = '';
            const out = [];
            for (const ch of str) {
                const wc = w + ch;
                if (dict.has(wc)) {
                    w = wc;
                } else {
                    out.push(dict.get(w));
                    if (dictSize < 65536) {
                        dict.set(wc, dictSize++);
                    }
                    w = ch;
                }
            }
            if (w !== '') out.push(dict.get(w));
            // Упаковываем 16-битные коды в байты (big-endian)
            const bytes = new Uint8Array(out.length * 2);
            for (let i = 0; i < out.length; i++) {
                bytes[i * 2] = (out[i] >> 8) & 0xff;
                bytes[i * 2 + 1] = out[i] & 0xff;
            }
            return bytes;
        }

        function lzwDecode(bytes) {
            const codes = [];
            for (let i = 0; i < bytes.length; i += 2) {
                codes.push((bytes[i] << 8) | bytes[i + 1]);
            }
            const dict = new Map();
            let dictSize = 256;
            for (let i = 0; i < 256; i++) dict.set(i, String.fromCharCode(i));
            let w = String.fromCharCode(codes[0]);
            let result = w;
            for (let i = 1; i < codes.length; i++) {
                const k = codes[i];
                let entry;
                if (dict.has(k)) {
                    entry = dict.get(k);
                } else if (k === dictSize) {
                    entry = w + w[0];
                } else {
                    throw new Error('Bad LZW code');
                }
                result += entry;
                if (dictSize < 65536) {
                    dict.set(dictSize++, w + entry[0]);
                }
                w = entry;
            }
            return result;
        }

        // UTF-8 ↔ байты
        function utf8ToBytes(str) {
            return new TextEncoder().encode(str);
        }
        function bytesToUtf8(bytes) {
            return new TextDecoder().decode(bytes);
        }

        // Base64URL (без '+' '/' '=') ↔ байты
        function bytesToBase64Url(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        function base64UrlToBytes(str) {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

                // Компактный формат: [version, updatedAt, tasks, completed, isSingleWeek]
        function buildCompactPayload() {
            const monday = getMonday(weekOffset);
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(formatDateISO(d));
            }
            const weekStart = weekDates[0];
            const weekEnd = weekDates[6];

            // Берем только задачи, попадающие в 7 дней текущей открытой недели
            const weekTasks = appData.tasks.filter(t => {
                if (t.repeat) {
                    return t.dateStr <= weekEnd;
                }
                return t.dateStr >= weekStart && t.dateStr <= weekEnd;
            });

            const compactTasks = weekTasks.map(t => ([
                t.id,
                t.title,
                t.time || '',
                t.repeat ? 1 : 0,
                t.dow ?? 0,
                t.dateStr
            ]));

            const weekDateSet = new Set(weekDates);
            const compactCompleted = [];
            for (const key of Object.keys(appData.completed)) {
                const sep = key.lastIndexOf('_');
                if (sep < 0) continue;
                const taskId = key.slice(0, sep);
                const dateISO = key.slice(sep + 1);
                if (weekDateSet.has(dateISO)) {
                    compactCompleted.push([taskId, dateISO]);
                }
            }

            return [1, appData.updatedAt || Date.now(), compactTasks, compactCompleted, 1];
        }

        function expandCompactPayload(payload) {
            if (!Array.isArray(payload) || payload[0] !== 1) {
                throw new Error('Unknown payload version');
            }
            const [, updatedAt, compactTasks, compactCompleted, isSingleWeek] = payload;
            const tasks = compactTasks.map(row => {
                const [id, title, time, repeatNum, dow, dateStr] = row;
                return {
                    id,
                    title,
                    time: time || '',
                    repeat: !!repeatNum,
                    dow: dow ?? 0,
                    dateStr
                };
            });
            const completed = {};
            for (const pair of (compactCompleted || [])) {
                if (!Array.isArray(pair) || pair.length < 2) continue;
                completed[`${pair[0]}_${pair[1]}`] = true;
            }
            return {
                updatedAt: updatedAt || Date.now(),
                tasks,
                completed,
                isSingleWeek: !!isSingleWeek
            };
        }

        // --- Основные функции экспорта/импорта ---

        function encodeData() {
            const compact = buildCompactPayload();
            const json = JSON.stringify(compact);
            const bytes = lzwEncode(json);
            return bytesToBase64Url(bytes);
        }

        function decodeData(code) {
            const trimmed = String(code).trim();

            try {
                const bytes = base64UrlToBytes(trimmed);
                const json = lzwDecode(bytes);
                const payload = JSON.parse(json);
                return expandCompactPayload(payload);
            } catch (e) {}

            try {
                let b64 = trimmed.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                const binary = atob(b64);
                const utf8 = bytesToUtf8(new Uint8Array([...binary].map(c => c.charCodeAt(0))));
                const data = JSON.parse(utf8);
                if (data && Array.isArray(data.tasks)) {
                    return {
                        updatedAt: data.updatedAt || Date.now(),
                        tasks: data.tasks,
                        completed: data.completed || {},
                        isSingleWeek: false
                    };
                }
            } catch (e) {}

            throw new Error('Не удалось распознать код');
        }

        function openExportModal() {
            const code = encodeData();
            document.getElementById('exportCodeArea').value = code;
            document.getElementById('exportModal').classList.add('open');
        }

        function copyExportCode(event) {
            const area = document.getElementById('exportCodeArea');
            area.select();
            area.setSelectionRange(0, area.value.length);
            try {
                document.execCommand('copy');
            } catch (e) {}
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(area.value).catch(() => {});
            }
            const btn = event && event.target ? event.target : null;
            if (!btn) return;
            const old = btn.textContent;
            btn.textContent = 'Скопировано!';
            setTimeout(() => { btn.textContent = old; }, 1500);
        }

        function openImportModal() {
            document.getElementById('importCodeArea').value = '';
            document.getElementById('importModal').classList.add('open');
        }

        function applyImportCode() {
            const code = document.getElementById('importCodeArea').value.trim();
            if (!code) {
                alert('Вставьте код.');
                return;
            }
            try {
                const data = decodeData(code);
                if (!data || !Array.isArray(data.tasks)) {
                    alert('Некорректный код.');
                    return;
                }

                if (data.isSingleWeek) {
                    if (!confirm('Добавить расписание из кода к вашим делам?')) return;
                    // Объединяем без дубликатов (по id или совпадению названия + даты + времени)
                    data.tasks.forEach(newTask => {
                        const exists = appData.tasks.some(old =>
                            old.id === newTask.id ||
                            (old.title === newTask.title && old.dateStr === newTask.dateStr && old.time === newTask.time)
                        );
                        if (!exists) {
                            appData.tasks.push(newTask);
                        }
                    });
                    Object.assign(appData.completed, data.completed || {});
                } else {
                    if (!confirm('Импортировать дела? Текущие дела будут заменены.')) return;
                    appData = {
                        updatedAt: data.updatedAt || Date.now(),
                        tasks: data.tasks,
                        completed: data.completed || {}
                    };
                }

                saveData();
                closeModal('importModal');
                alert('Импорт выполнен успешно.');
            } catch (e) {
                alert('Не удалось прочитать код. Проверьте, что он скопирован полностью.');
            }
        }

        init();

        // Регистрация service worker для работы офлайн и установки как приложение
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
